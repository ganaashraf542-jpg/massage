<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Send Me a Message</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #ff7e5f,
                #feb47b
            );
        }

        .container {
            width: 90%;
            max-width: 550px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;

            height: 200px;

            padding: 15px;

            border: 1px solid #ccc;

            border-radius: 10px;

            font-size: 16px;

            resize: none;
        }

        textarea:focus {
            outline: none;

            border-color: #ff7e5f;
        }

        button {
            width: 100%;

            margin-top: 20px;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #ff7e5f;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #e85d3f;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>💌 Send Me a Message</h1>

        <p>
            Write anything you want to tell me.
        </p>


        <form
            action="https://formspree.io/f/xbgdoovv"
            method="POST"
        >

            <textarea
                name="message"
                placeholder="Write your message here..."
                required
            ></textarea>


            <button type="submit">
                Send Message 💌
            </button>

        </form>

    </div>

</body>

</html>
